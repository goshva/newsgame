<!doctype html>
<html lang="zh-CN" data-game="cn-science-month">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>猜数字：全国科普月</title>
<link rel="stylesheet" href="../shared/game.css">
<style>
  .round { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; margin: 0 0 6px; }
  .prompt { font-size: 20px; font-weight: 700; line-height: 1.4; margin: 0 0 16px; }
  .value { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 0; }
  input[type="range"] { width: 100%; height: 36px; accent-color: var(--accent); margin: 8px 0 14px; }
  .reveal { display: grid; gap: 6px; margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: var(--surface); }
  .reveal p { margin: 0; }
  .pts { font-weight: 800; color: var(--accent); }
  .langswitch { margin-left: auto; }
  .row { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<main id="stage"></main>
<script src="../shared/runtime.js"></script>
<script src="game.js"></script>
</body>
</html>
