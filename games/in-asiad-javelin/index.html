<!doctype html>
<html lang="en" data-game="in-asiad-javelin">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Javelin final</title>
<link rel="stylesheet" href="../shared/game.css">
<style>
  :lang(hi) body, :lang(hi) button { font-family: "Nirmala UI", "Mangal", "Noto Sans Devanagari", system-ui, sans-serif; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-weight: 600; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  canvas { display: block; width: 100%; height: 170px; border-radius: 10px; margin: 8px 0 12px; background: #2f6b3a; }
  .meter { display: grid; grid-template-columns: 64px 1fr 56px; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .track { position: relative; height: 14px; border-radius: 7px; background: var(--surface); overflow: hidden; }
  .track i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: linear-gradient(90deg, #8fd3a0, #ffcc33, #ff6b5a); }
  .track.angle i { background: var(--accent); }
  .act { width: 100%; min-height: 54px; font-size: 18px; margin-top: 6px; }
  .row { display: flex; justify-content: flex-end; }
</style>
</head>
<body>
<main id="stage"></main>
<script src="../shared/runtime.js"></script>
<script src="game.js"></script>
</body>
</html>
