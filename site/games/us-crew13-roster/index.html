<!doctype html>
<html lang="en" data-game="us-crew13-roster">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew-13: mission briefing</title>
<link rel="stylesheet" href="../shared/game.css">
<style>
  .step { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
  .names { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .name[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .name.used { opacity: .45; }
  .seats { display: grid; gap: 8px; }
  .seat { display: grid; gap: 2px; text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px dashed var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font: inherit; }
  .seat small { color: var(--muted); font-size: 13px; }
  .seat strong { font-size: 16px; }
  .seat.filled { border-style: solid; }
  .seat.ok { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
  .seat.bad { border-color: var(--err); box-shadow: inset 4px 0 0 var(--err); }
  .q { font-size: 19px; font-weight: 700; margin: 0 0 12px; }
  .opts { display: grid; gap: 8px; }
  .opt { justify-content: flex-start; text-align: left; border-radius: 10px; min-height: 48px; }
  .opt.ok { border-color: var(--ok); color: var(--ok); }
  .opt.bad { border-color: var(--err); color: var(--err); }
  .fb { margin: 12px 0 0; }
  .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
</style>
</head>
<body>
<main id="stage"></main>
<script src="../shared/runtime.js"></script>
<script src="game.js"></script>
</body>
</html>
